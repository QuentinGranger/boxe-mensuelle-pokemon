name: Update Pokemon Concierge Calendar

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Pokemon Concierge Experience
        run: python engine/pokemon_concierge.py

      - name: Commit calendar update
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add output
          git commit -m "Update Pokemon Concierge monthly experience" || exit 0
          git push
